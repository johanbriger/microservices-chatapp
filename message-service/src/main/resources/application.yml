server:
  port: 8082

spring:
  application:
    name: message-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Databaskonfiguration för Message Service
  datasource:
    url: jdbc:h2:mem:messagedb # Notera eget namn: messagedb!
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true # Bra för felsökning, visar SQL-frågorna i loggen!
  h2:
    console:
      enabled: true
      path: /h2-console

grpc:
  client:
    user-service:
      address: 'static://localhost:9090'
      negotiationType: plaintext

