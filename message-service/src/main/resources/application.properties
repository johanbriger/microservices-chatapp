server.port=8082
spring.application.name=message-service

grpc.client.user-service.address=static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9090}
grpc.client.user-service.negotiation-type=plaintext

spring.datasource.url=jdbc:h2:mem:messagedb
spring.h2.console.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}