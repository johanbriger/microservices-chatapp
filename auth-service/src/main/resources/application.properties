server.port=8083
spring.application.name=auth-service

# Konfiguration för gRPC-klienten som pratar med user-service
grpc.client.user-service.address=static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9090}
grpc.client.user-service.negotiation-type=plaintext

# Din JWT-nyckel (bra att ha här så den kan styras via Kubernetes Secrets senare)
jwt.secret=${JWT_SECRET:min-super-hemliga-nyckel-som-ingen-far-veta-om-12345}