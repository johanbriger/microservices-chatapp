server.port=8084
spring.application.name=bot-service

# URL till Message Service (för att skicka svar)
services.message.url=http://${MESSAGE_SERVICE_HOST:localhost}:8082

# RabbitMQ-anslutning (Viktigt!)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}