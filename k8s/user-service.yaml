apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: chatapp-user:latest
          imagePullPolicy: Never # VIKTIGT: Letar lokalt i Minikube istället för Docker Hub
          ports:
            - containerPort: 8081 # HTTP
            - containerPort: 9090 # gRPC
          envFrom:
            - configMapRef:
                name: chatapp-config # Hämtar alla variabler från Steg 1
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9090
      targetPort: 9090