server:
  port: 8080

spring:
  application:
    name: bff-service
  cloud:
    gateway:
      globalcors:
        add-to-remove-remote-address-header: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - OPTIONS
            allowedHeaders: "*"

      # Filter som ligger på gateway-nivå
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST

      # Routes för API Gateway
      routes:
        - id: message-service
          uri: http://${MESSAGE_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/messages/**
          filters:
            - AuthenticationFilter

        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/users/**

        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/auth/**

  # JWT-inställningar
  jwt:
    secret: "min-super-hemliga-nyckel-som-ingen-far-veta-om-12345"

# Dessa värden används av din Java-kod via @Value("${services.user.url}")
services:
  auth:
    url: http://${AUTH_SERVICE_HOST:localhost}:8083
  user:
    url: http://${USER_SERVICE_HOST:localhost}:8081
  message:
    url: http://${MESSAGE_SERVICE_HOST:localhost}:8082