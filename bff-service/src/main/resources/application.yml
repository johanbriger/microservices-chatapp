server:
  port: 8080

spring:
  application:
    name: bff-service
  cloud:
    gateway:
      globalcors:
        add-to-remove-remote-address-header: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - OPTIONS
            allowedHeaders: "*"

      # Filter som ligger på gateway-nivå
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST

      # Routes ligger direkt under gateway-noden
      routes:
        - id: message-service
          uri: http://localhost:8082
          predicates:
            - Path=/messages/**
          filters:
            - AuthenticationFilter

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**

  # JWT-inställningar direkt under spring:
  jwt:
    secret: "min-super-hemliga-nyckel-som-ingen-far-veta-om-12345"